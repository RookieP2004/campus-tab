<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Campus TAB</title>
    <script>
      // Apply the saved theme and language before the first paint, so there is
      // no flash of the wrong theme. Mirrors src/stores/preferences.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('campus-tab:preferences') || '{}').state || {};
          var theme = saved.theme || 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage blocked: the CSS falls back to the device setting */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
