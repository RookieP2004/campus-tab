[package]
name = "campus-tab"
version = "0.1.0"
description = "Campus TAB for Windows and macOS"
authors = ["Sujal Chandel"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[lib]
name = "campus_tab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = { version = "=2.14.1", optional = true }

[features]
# Auto-update: on only in builds that carry the update host and key (CI
# passes --features updater with the TAURI_UPDATER_* secrets).
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
