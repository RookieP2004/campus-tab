# Campus TAB local development stack.
#   cd infra && docker compose up
# PHP, Composer and Node run only inside these containers. backend/vendor and
# every node_modules folder live in named volumes, never on the host drive.
name: campus-tab

x-api-base: &api-base
  build:
    context: ..
    dockerfile: infra/docker/api/Dockerfile
  image: campus-tab/api:dev
  working_dir: /app
  volumes:
    - ../backend:/app
    - backend_vendor:/app/vendor
    - composer_cache:/composer/cache
    - ../docs:/docs
  environment: &api-env
    REPORT_PATH: /docs/report
    APP_ENV: local
    APP_URL: http://127.0.0.1:${API_PORT:-8000}
    FRONTEND_URL: http://127.0.0.1:${WEB_PORT:-5173}
    SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:${WEB_PORT:-5173}
    DB_CONNECTION: mongodb
    MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    MONGODB_DATABASE: campus_tab
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      # Initiates the single-node replica set on first start, then reports
      # healthy only once this node is the writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    <<: *api-base
    environment:
      <<: *api-env
      CAMPUS_TAB_BOOTSTRAP: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  horizon:
    <<: *api-base
    command: ["php", "artisan", "horizon"]
    depends_on:
      api:
        condition: service_healthy

  reverb:
    <<: *api-base
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/infra/docker/web/entrypoint.sh"]
    command: ["npm", "run", "dev", "--workspace", "frontend", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_USE_POLLING: "true"
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_frontend:/workspace/frontend/node_modules
      - node_modules_ui:/workspace/packages/ui/node_modules
      - node_modules_api:/workspace/packages/api/node_modules
    depends_on:
      - api

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  backend_vendor:
  composer_cache:
  node_modules_root:
  node_modules_frontend:
  node_modules_ui:
  node_modules_api:
