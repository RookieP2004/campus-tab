name: Apps

# Builds the four apps from the same React build. Nothing is built on the
# owner's computer:
#   Android APK on Linux, Windows installer on Windows, unsigned iOS and
#   macOS builds on macOS. Each run leaves the files under "Artifacts".
#
# The API address is set at build time:
#   - a manual run ("Run workflow") asks for it, e.g. http://192.168.31.85:8000
#     to test a phone against a computer on the same Wi-Fi;
#   - other runs use the repository variable APP_API_URL (Settings → Secrets
#     and variables → Actions → Variables), or a placeholder.
#
# Secrets (all optional; without them the build still runs):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   release signing (apps/mobile/README.md)
#   GOOGLE_SERVICES_JSON   Firebase config for Android push
#   TAURI_UPDATER_PUBKEY, TAURI_SIGNING_PRIVATE_KEY,
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD, TAURI_UPDATER_ENDPOINT   desktop auto-update

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API address (server root), e.g. https://api.example.in or http://192.168.31.85:8000"
        required: true
      web_url:
        description: "Public web address for links (optional), e.g. https://app.example.in"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/apps.yml"
      - ".github/scripts/app-env.mjs"

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_URL: ${{ github.event.inputs.api_url || vars.APP_API_URL || 'https://api.campustab.invalid' }}
  WEB_URL: ${{ github.event.inputs.web_url || vars.APP_WEB_URL || '' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firebase config for push (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "PUSH=true" >> "$GITHUB_ENV"
          else
            echo "PUSH=false" >> "$GITHUB_ENV"
          fi

      - name: Build settings
        run: node .github/scripts/app-env.mjs mobile "$API_URL" "$WEB_URL" "$PUSH"

      - name: Build the web app for the phone
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @campus-tab/frontend

      - name: Icons and native sync
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run icons
          npx cap sync android

      - name: Release key (from secrets, never the repository)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "CAMPUS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "CAMPUS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "CAMPUS_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "CAMPUS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK (fine for testing, not for the Play Store)."
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Gradle build
        working-directory: apps/mobile/android
        env:
          CAMPUS_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = release ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/$VARIANT/*.apk "$RUNNER_TEMP/out/campus-tab-android-$VARIANT.apk"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: campus-tab-android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Build settings
        run: node .github/scripts/app-env.mjs desktop "$API_URL" "$WEB_URL"

      - name: Build the web app for the desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @campus-tab/frontend

      - name: Auto-update settings (only with the updater secrets)
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
        run: |
          if [ -n "$TAURI_UPDATER_PUBKEY" ] && [ -n "$TAURI_UPDATER_ENDPOINT" ]; then
            node -e 'require("fs").writeFileSync("apps/desktop/src-tauri/tauri.updater.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY,endpoints:[process.env.TAURI_UPDATER_ENDPOINT]}}}))'
            echo 'TAURI_ARGS=--features updater --config src-tauri/tauri.updater.json' >> "$GITHUB_ENV"
          fi

      - name: Build the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npm run icons
          npx tauri build --bundles nsis $TAURI_ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: campus-tab-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build settings
        run: node .github/scripts/app-env.mjs desktop "$API_URL" "$WEB_URL"

      - name: Build the web app for the desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @campus-tab/frontend

      - name: Build the app (universal, not signed)
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run icons
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: campus-tab-macos-unsigned
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build settings
        run: node .github/scripts/app-env.mjs mobile "$API_URL" "$WEB_URL" false

      - name: Build the web app for the phone
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace @campus-tab/frontend

      - name: Icons and native sync
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run icons
          npx cap sync ios

      - name: Build without signing
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out" && zip -qr campus-tab-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: campus-tab-ios-unsigned
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 14
