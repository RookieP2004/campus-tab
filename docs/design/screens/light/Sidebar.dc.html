<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus TAB sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 248px; min-height: 960px; height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; font-family: Inter, system-ui, sans-serif; color: #0F172A">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1D4ED8"></rect><path d="M13 23 24 14l11 9M16 21v14h16V21M22 35v-6h4v6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em">Campus <span style="font-weight: 800; color: #1D4ED8">TAB</span></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #E2E8F0; border-radius: 10px">
<div style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">SPS</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 13px; font-weight: 600; line-height: 1.3">Sunrise Public School</span>
<span style="font-size: 12px; color: #475569">Bhopal · CBSE</span>
</div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 1px solid #E2E8F0; border-radius: 8px; background: #F8FAFC; color: #334155; font: 500 13px Inter, sans-serif">Year 2026-27<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="11">
<li><a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{item.bg}}; color: {{item.fg}}; font-weight: {{item.fw}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg><span style="flex: 1">{{item.label}}</span><sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #B91C1C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{item.badge}}</span></sc-if></a></li>
</sc-for>
</ul>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid #E2E8F0">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #DBEAFE; color: #1E40AF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{initials}}</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 13px; font-weight: 600">{{personName}}</span>
<span style="font-size: 12px; color: #475569">{{role}}</span>
</div>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #E2E8F0; border-radius: 8px; background: #FFFFFF; color: #334155; font: 500 13px Inter, sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Language: English</button>
<a href="{{themeHref}}" aria-label="Theme: Light. Switch to dark theme" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #E2E8F0; border-radius: 8px; background: #FFFFFF; color: #334155; font: 500 13px Inter, sans-serif; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Theme: Light</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","approvals","students","staff","attendance","leave","tests","reports","fees","notices","settings"],"default":"dashboard"},"role":{"editor":null,"default":"Principal"},"personName":{"editor":null,"default":"Dr. Meera Iyer"},"initials":{"editor":null,"default":"MI"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const defs = [
      ['dashboard', 'Dashboard', 'Main.dc.html', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z', ''],
      ['approvals', 'Approvals', 'Approvals.dc.html', 'M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7z', '4'],
      ['students', 'Students', '#', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', ''],
      ['staff', 'Staff', '#', 'M3 7h18v13H3zM8 7V4h8v3M3 13h18', ''],
      ['attendance', 'Attendance', '#', 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', ''],
      ['leave', 'Leave', '#', 'M3 5h18v16H3zM16 3v4M8 3v4M3 10h18', ''],
      ['tests', 'Tests and marks', 'Markbook.dc.html', 'M9 3h6v3H9zM6 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1M8 12h8M8 16h5', ''],
      ['reports', 'Report cards', '#', 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 14h8M8 18h5', ''],
      ['fees', 'Fees', 'FeeCounter.dc.html', 'M6 4h12M6 9h12M6 4h3a5 5 0 0 1 0 10H6l8 7', ''],
      ['notices', 'Notices', '#', 'M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0', ''],
      ['settings', 'Settings', '#', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', '']
    ];
    const items = defs.map(([key, label, href, icon, badge]) => {
      const on = key === active;
      return { key, label, href, icon, badge, hasBadge: badge !== '', bg: on ? '#EFF6FF' : 'transparent', fg: on ? '#1D4ED8' : '#334155', fw: on ? 600 : 500, current: on ? 'page' : undefined };
    });
    const themeBase = '/dark/';
    const screens = { dashboard: 'Main.dc.html', approvals: 'Approvals.dc.html', tests: 'Markbook.dc.html', fees: 'FeeCounter.dc.html' };
    const themeHref = themeBase + (screens[active] || 'Main.dc.html');
    return { items, themeHref, role: this.props.role ?? 'Principal', personName: this.props.personName ?? 'Dr. Meera Iyer', initials: this.props.initials ?? 'MI' };
  }
}
</script>
</body>
</html>
